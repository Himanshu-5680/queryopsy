name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validator, engine, pipeline and every case
        run: python -m pytest --ignore=tests/e2e
      - name: Committed site is in sync with data/cases.json
        run: |
          python tools/build_site.py
          git diff --exit-code -- index.html

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Solve every level in the UI, themes, mobile, offline
        run: python -m pytest tests/e2e
      - name: Build the web bundle
        run: python tools/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: queryopsy-web
          path: dist/queryopsy-web-*.zip
          retention-days: 14
